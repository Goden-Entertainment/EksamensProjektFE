<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Log ind</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="left">
    <h2>Behandl anmodninger, hold styr på kalenderen, og bekræft hver booking i ro.</h2>
</div>

<div class="link">
    <a href="../index.html">&larr; Tilbage til hjemmeside</a>
</div>

<div class="right">
    <form class="form">
        <p class="form-title">Log ind på din konto</p>
        <div class="input-container">
            <input type="text" id="username" placeholder="Brugernavn">
        </div>
        <div class="input-container">
            <input type="password" id="password" placeholder="Adgangskode">
        </div>
        <button type="button" id="loginButton" class="submit">Log ind</button>
    </form>
</div>

<script src="../js/login.js" defer></script>
</body>
</html>
